<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buscador de Rutas</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="main-header">
      <h1>Buscador de Rutas 🚍</h1>
      <p>Encuentra la mejor ruta entre tus ciudades favoritas</p>
    </header>

    <!-- CONTENIDO PRINCIPAL ENVUELTO EN <main> -->
    <main class="main-content">
      <div class="container">
        <h2>Busca tu Ruta</h2>

        <label for="origen">Ciudad de Origen</label>
        <input type="text" id="origen" placeholder="Ej. Barcelona" />

        <label for="destino">Ciudad de Destino</label>
        <input type="text" id="destino" placeholder="Ej. Valencia" />

        <label for="tipoRuta">Tipo de Ruta</label>
        <select id="tipoRuta">
          <option value="ambas">Ambas</option>
          <option value="terrestre">Terrestre</option>
          <option value="maritimo">Marítimo</option>
        </select>

        <button onclick="buscarRuta()">Buscar Ruta</button>

        <div class="results" id="resultados" style="display: none"></div>
      </div>
    </main>

    <footer class="main-footer">
      <p>
        <a href="#">Términos & Privacidad</a> |
        <a href="https://www.facebook.com" target="_blank">Facebook</a>
      </p>
      <p>&copy; 2025 Buscador de Rutas</p>
    </footer>

    <!-- CORREGIDO EL CIERRE DEL SCRIPT -->
    <script src="main.js"></script>
  </body>
</html>
